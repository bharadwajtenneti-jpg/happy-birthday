<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Heart Lock Memory Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;
overflow:hidden;

font-family:'Poppins',sans-serif;

display:flex;
justify-content:center;
align-items:center;

background:
radial-gradient(circle at top left,#2b0057 0%,#120018 45%,#000000 100%);

color:white;

position:relative;
}

/* BACKGROUND GLOW */

.glow1,
.glow2{

position:absolute;

border-radius:50%;

filter:blur(130px);

opacity:0.22;
}

.glow1{

width:500px;
height:500px;

background:#ff4d88;

top:-180px;
left:-120px;
}

.glow2{

width:450px;
height:450px;

background:#7b2cff;

bottom:-180px;
right:-120px;
}

/* STARS */

.stars{

position:absolute;

width:100%;
height:100%;

overflow:hidden;
}

.star{

position:absolute;

width:3px;
height:3px;

background:white;

border-radius:50%;

opacity:0.7;

animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{

from{
opacity:0.2;
transform:scale(0.8);
}

to{
opacity:1;
transform:scale(1.4);
}
}

/* FLOATING HEARTS */

.float{

position:absolute;

font-size:1.5rem;

opacity:0.5;

animation:float 9s linear infinite;
}

@keyframes float{

0%{

transform:
translateY(120vh)
rotate(0deg);

opacity:0;
}

20%{
opacity:0.6;
}

100%{

transform:
translateY(-120vh)
rotate(360deg);

opacity:0;
}
}

/* MAIN */

.container{

position:relative;

z-index:5;

text-align:center;

width:90%;
max-width:950px;

animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(40px);
}

to{

opacity:1;

transform:translateY(0);
}
}

/* HEART */

.heart{

font-size:7rem;

cursor:pointer;

animation:heartbeat 1.8s infinite;

filter:
drop-shadow(0 0 15px #ff4d88)
drop-shadow(0 0 35px #ff0066);

transition:0.3s;
}

.heart:hover{

transform:scale(1.1);
}

@keyframes heartbeat{

0%,100%{
transform:scale(1);
}

25%{
transform:scale(1.12);
}

50%{
transform:scale(0.95);
}

75%{
transform:scale(1.08);
}
}

/* TITLE */

.title{

font-size:2.8rem;

font-weight:600;

margin-top:20px;

margin-bottom:15px;

text-shadow:
0 0 15px rgba(255,255,255,0.18);
}

.sub{

font-size:1.15rem;

color:#e3d9ff;

line-height:1.8;

margin-bottom:50px;
}

/* CARD */

.card{

display:none;

margin:auto;

width:90%;
max-width:760px;

padding:55px;

border-radius:40px;

background:
linear-gradient(
145deg,
rgba(255,255,255,0.15),
rgba(255,255,255,0.05)
);

backdrop-filter:blur(22px);

border:1px solid rgba(255,255,255,0.12);

box-shadow:
0 0 60px rgba(255,105,180,0.15);

position:relative;

overflow:hidden;

animation:cardShow 1.5s ease forwards;
}

.card::before{

content:"";

position:absolute;

width:320px;
height:320px;

background:rgba(255,182,193,0.15);

border-radius:50%;

filter:blur(90px);

top:-120px;
right:-80px;
}

@keyframes cardShow{

from{

opacity:0;

transform:
translateY(80px)
scale(0.8);
}

to{

opacity:1;

transform:
translateY(0)
scale(1);
}
}

/* CARD TITLE */

.card-title{

font-family:'Cormorant Garamond',serif;

font-size:3rem;

font-weight:600;

margin-bottom:35px;

line-height:1.2;

color:#fff4f7;

text-shadow:
0 0 15px rgba(255,255,255,0.12);
}

/* MESSAGE */

.message{

font-family:'Cormorant Garamond',serif;

font-size:1.7rem;

line-height:2;

letter-spacing:0.5px;

color:#fff7fb;

min-height:250px;

text-shadow:
0 0 10px rgba(255,255,255,0.08);
}

/* BUTTON */

.next-btn{

display:none;

margin-top:45px;

padding:16px 42px;

border:none;

border-radius:50px;

background:
linear-gradient(to right,#ff4d88,#7b2cff);

color:white;

font-size:1rem;

font-weight:600;

cursor:pointer;

transition:0.3s;

box-shadow:
0 0 25px rgba(255,77,136,0.35);
}

.next-btn:hover{

transform:scale(1.08);
}

/* MOBILE */

@media(max-width:768px){

.title{
font-size:2rem;
}

.sub{
font-size:1rem;
}

.heart{
font-size:5rem;
}

.card{
padding:30px;
}

.card-title{
font-size:2.2rem;
}

.message{
font-size:1.3rem;
line-height:1.8;
}
}

</style>
</head>

<body>

<!-- GLOW -->

<div class="glow1"></div>
<div class="glow2"></div>

<!-- STARS -->

<div class="stars">

<div class="star" style="top:10%;left:15%;"></div>
<div class="star" style="top:18%;left:72%;"></div>
<div class="star" style="top:75%;left:30%;"></div>
<div class="star" style="top:55%;left:84%;"></div>
<div class="star" style="top:42%;left:48%;"></div>
<div class="star" style="top:80%;left:66%;"></div>

</div>

<!-- FLOATING -->

<div class="float" style="left:10%; animation-duration:9s;">💕</div>
<div class="float" style="left:25%; animation-duration:12s;">🫶</div>
<div class="float" style="left:42%; animation-duration:10s;">💌</div>
<div class="float" style="left:68%; animation-duration:11s;">💕</div>
<div class="float" style="left:85%; animation-duration:13s;">🫶</div>

<!-- MAIN -->

<div class="container">

<div class="heart" onclick="openMemory()">
❤️
</div>

<div class="title">
Heart Lock Memory Portal
</div>

<div class="sub">
Every heartbeat hides a memory... <br>
Touch mine 🫶
</div>

<!-- CARD -->

<div class="card" id="card">

<div class="card-title">
A drawing brought you into my life 🎨
</div>

<div class="message" id="typing"></div>

<button class="next-btn" id="nextBtn"
onclick="window.location.href='page4.html'">
Unlock More Memories 💌
</button>

</div>

</div>

<script>

const text = `You texted me about my sketch,
and that entire day,
I couldn't stop smiling while talking to you 🤭

Later, when I quietly took my drawing back from you,
I never knew that tiny moment
would become one of my favorite memories forever 🫶`;

let i = 0;

function openMemory(){

document.querySelector(".heart").style.display = "none";

document.querySelector(".title").style.display = "none";

document.querySelector(".sub").style.display = "none";

const card = document.getElementById("card");

card.style.display = "block";

typeText();
}

function typeText(){

if(i < text.length){

document.getElementById("typing").innerHTML += text.charAt(i);

i++;

setTimeout(typeText,38);

}else{

document.getElementById("nextBtn").style.display = "inline-block";
}
}

</script>

</body>
</html>
